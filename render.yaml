# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sefer-baklik
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: PLATFORM_USERNAME
        value: admin
      - key: PLATFORM_PASSWORD
        sync: false
      - key: DEMO_BARBER_PASSWORD
        value: barber123
      - key: CRON_SECRET
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

  # Reminder SMS every 5 minutes
  - type: cron
    name: sefer-baklik-reminders
    runtime: node
    plan: free
    region: frankfurt
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: node -e "fetch(process.env.APP_URL+'/api/cron/reminders',{headers:{authorization:'Bearer '+process.env.CRON_SECRET}}).then(async r=>{console.log(await r.text()); if(!r.ok) process.exit(1)}).catch(e=>{console.error(e); process.exit(1)})"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
