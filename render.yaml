# Render Blueprint — https://render.com/docs/blueprint-spec
# Free tier: only 1 Postgres. Reuse your existing Render DB URL in DATABASE_URL.
services:
  - type: web
    name: sefer-baklik
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: PLATFORM_USERNAME
        value: admin
      - key: PLATFORM_PASSWORD
        sync: false
      - key: DEMO_BARBER_PASSWORD
        value: barber123
